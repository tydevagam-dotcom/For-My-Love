<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Questions ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#ffd6e7,#fff0f5);
    padding:40px 20px;
}


.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:35px;
    border-radius:25px;
    border:3px solid #ffc1d9;
    box-shadow:0 15px 40px rgba(255,105,180,0.25);
}


h1{
    text-align:center;
    color:#e91e63;
    margin-bottom:30px;
}


label{
    display:block;
    margin-top:20px;
    margin-bottom:8px;
    color:#d81b60;
    font-weight:bold;
    font-size:16px;
}


input,
textarea{

    width:100%;
    padding:12px;
    border-radius:12px;
    border:2px solid #ffc1d9;
    font-size:15px;
    outline:none;

}


input:focus,
textarea:focus{

    border-color:#ff4d88;

}


textarea{

    resize:none;
    height:100px;

}


button{

    width:100%;
    margin-top:30px;
    padding:15px;
    border:none;
    border-radius:50px;
    background:linear-gradient(45deg,#ff4d88,#ff85b3);
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;

}


button:hover{

    transform:scale(1.03);
    background:#e91e63;

}


.heart{

    text-align:center;
    font-size:35px;
    margin-bottom:10px;

}

</style>

</head>


<body>


<div class="container">

<div class="heart">💖</div>

<h1>A Few Questions For You ❤️</h1>


<form action="03.html" method="get">


<label>1. Your Name 💕</label>
<input type="text" name="name" required>


<label>2. Who are you to him? 🌹</label>
<input type="text" name="who" required>


<label>3. How do you want him to call you? 🥰</label>
<input type="text" name="call" required>


<label>4. On a scale of 1-100, how much do you love him? ❤️</label>
<input type="number" name="love" min="1" max="100" required>


<label>5. Is there anything you want him to do for you? 💌</label>
<textarea name="want" required></textarea>


<label>6. Is there any regret that you felt choosing him? 🌸</label>
<textarea name="regret" required></textarea>


<label>7. If there's one thing you could do to him, what would it be? 💖</label>
<textarea name="thing" required></textarea>


<label>8. On your favorite list, which position am I at? ✨</label>
<input type="number" name="position" required>


<label>9. One thing about him that annoys you 🙈</label>
<textarea name="annoy" required></textarea>


<label>10. Did my care feel good? ❤️</label>
<input type="text" name="care" required>


<label>11. "You are special to me." Is me the same for you? 💕</label>
<input type="text" name="special" required>


<button type="submit">
    Submit ❤️
</button>


</form>

</div>


</body>
</html>
