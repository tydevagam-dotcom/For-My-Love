<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Questions ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}


/* Main Card */

.card{
    background:rgba(255,255,255,0.95);
    width:450px;
    padding:35px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 20px 50px rgba(255,0,100,0.25);
    border:3px solid #ff7aa2;
}


.heart{
    font-size:50px;
}


h1{
    color:#e91e63;
    margin:15px 0 25px;
}


/* Questions */

.question{
    display:none;
}

.question.active{
    display:block;
}


label{
    display:block;
    color:#c2185b;
    font-size:18px;
    font-weight:bold;
    margin-bottom:20px;
    line-height:1.5;
}


input,
textarea{

    width:100%;
    padding:15px;
    border-radius:15px;
    border:2px solid #ffb6c9;
    font-size:16px;
    outline:none;

}


input:focus,
textarea:focus{

    border-color:#ff4d88;

}


textarea{

    height:120px;
    resize:none;

}


/* Buttons */

button{

    margin-top:25px;
    padding:14px 40px;
    border:none;
    border-radius:50px;
    background:linear-gradient(45deg,#ff4d88,#ff85b3);
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;

}


button:hover{

    transform:scale(1.05);
    background:#e91e63;

}


#counter{

    margin-top:20px;
    color:#ff4d88;
    font-size:14px;

}

</style>

</head>


<body>


<div class="card">

<div class="heart">💖</div>

<h1>Love Questions</h1>


<form id="loveForm">


<div class="question active">

<label>
1. Your Name 💕
</label>

<input type="text" name="name" required>

</div>



<div class="question">

<label>
2. Who are you to him? 🌹
</label>

<input type="text" name="who" required>

</div>



<div class="question">

<label>
3. How do you want him to call you? 🥰
</label>

<input type="text" name="call" required>

</div>



<div class="question">

<label>
4. On a scale of 1-100, how much do you love him? ❤️
</label>

<input type="text" name="love" required>

</div>



<div class="question">

<label>
5. Is there anything you want him to do for you? 💌
</label>

<textarea name="want" required></textarea>

</div>



<div class="question">

<label>
6. Is there any regret that you felt choosing him? 🌸
</label>

<textarea name="regret" required></textarea>

</div>



<div class="question">

<label>
7. If there's one thing you could do to him, what would it be? 💖
</label>

<textarea name="thing" required></textarea>

</div>



<div class="question">

<label>
8. On your favorite list, which position am I at? ✨
</label>

<input type="text" name="position" required>

</div>



<div class="question">

<label>
9. One thing about him that annoys you 🙈
</label>

<textarea name="annoy" required></textarea>

</div>



<div class="question">

<label>
10. Did my care feel good? ❤️
</label>

<input type="text" name="care" required>

</div>



<div class="question">

<label>
11. "You are special to me." Is me the same for you? 💖
</label>

<input type="text" name="special" required>

</div>



<button type="button" id="nextBtn">
Next 💕
</button>


<div id="counter">
Question 1 / 11
</div>


</form>

</div>



<script>

let current = 0;

const questions = document.querySelectorAll(".question");
const nextBtn = document.getElementById("nextBtn");
const counter = document.getElementById("counter");


nextBtn.onclick = function(){

    let answer = questions[current].querySelector("input, textarea");


    if(answer.value.trim() === ""){
        alert("Please answer this question ❤️");
        return;
    }


    // Last question - go to your next page
    if(current === questions.length - 1){

        window.location.href = "03.html";
        return;

    }


    questions[current].classList.remove("active");

    current++;

    questions[current].classList.add("active");


    counter.innerHTML =
    "Question " + (current + 1) + " / " + questions.length;


    if(current === questions.length - 1){

        nextBtn.innerHTML = "Submit ❤️";

    }

};

</script>







</script>


</body>
</html>
