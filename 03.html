<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#ff4d6d,#ff8fab);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.card{
    width:90%;
    max-width:420px;
    background:white;
    border-radius:20px;
    padding:35px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    animation:pop .5s ease;
}

@keyframes pop{
    from{
        transform:scale(.7);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

h2{
    color:#ff2e63;
    margin-bottom:25px;
    font-size:28px;
}

button{
    padding:14px 35px;
    border:none;
    border-radius:50px;
    background:#ff2e63;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
    background:#e6004c;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="card">

    <div id="first">
        <h2>Wanna see who he loves more than you? 🤭</h2>
        <button onclick="nextMessage()">Yes ❤️</button>
    </div>

    <div id="second" class="hidden">
        <h2>Idiot 😂❤️<br>Who else could it be?</h2>
        <br>
        <button onclick="goNext()">Continue ➜</button>
    </div>

</div>

<script>
function nextMessage(){
    document.getElementById("first").classList.add("hidden");
    document.getElementById("second").classList.remove("hidden");
}

function goNext(){
    window.location.href="04.html";
}
</script>

</body>
</html>
