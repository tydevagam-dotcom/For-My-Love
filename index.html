<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤️</title>

<style>
button{

    margin-top:30px;

    padding:18px 50px;

    border:none;

    border-radius:50px;

    background:linear-gradient(45deg,#ff1493,#ff69b4);

    color:white;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 0 20px #ff1493;

    transition:0.3s;

}
    #loveAlert{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(5px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.popup{
    background: #fff;
    width: 380px;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    border: 3px solid #ff6fa5;
    box-shadow: 0 15px 35px rgba(255,105,180,.35);
}

.popup h1{
    color: #ff2d75;
    margin-bottom: 15px;
}

.popup p{
    color: #555;
    line-height: 1.6;
}

.popup button{
    margin-top: 20px;
    padding: 12px 30px;
    border: none;
    border-radius: 50px;
    background: #ff4d88;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

.popup button:hover{
    background: #ff2d75;
}


button:hover{

    transform:scale(1.1);

    box-shadow:
    0 0 40px white;

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffb6c1);
    font-family:Arial, Helvetica, sans-serif;
}

/* Center Text */

.container{
    text-align:center;
    color:white;
    z-index:100;
}

h1{
    font-size:70px;
    text-shadow:0 0 20px white;
    animation:glow 2s infinite alternate;
}

p{
    margin-top:20px;
    font-size:25px;
    letter-spacing:2px;
}

@keyframes glow{

from{
text-shadow:0 0 10px white;
}

to{
text-shadow:
0 0 20px white,
0 0 40px pink,
0 0 60px red;
}

}

/* Floating Hearts */

.heart{
    position:absolute;
    color:#ff1744;
    animation:float linear forwards;
    opacity:0.9;
}

@keyframes float{

0%{
transform:translateY(100vh) scale(0.5);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-120vh) scale(1.5);
opacity:0;
}

}

</style>

</head>

<body>
    <div id="loveAlert">
    <div class="popup">
        <h1>🚨 Love Alert! ❤️</h1>

        <p>
            Entering this page may increase your heartbeat,
            cause uncontrollable smiling, and fill your heart
            with love and happiness.
        </p>

        <p><strong>Proceed at your own risk. 💖</strong></p>

        <button onclick="closeAlert()">Continue ❤️</button>
    </div>
</div>

<div class="container">
    <h1>💓 TO MY BBG 💓</h1>
    <p>A special gift from your jagi💗🎀.</p>
    <button class="surprise-btn" onclick="goToNextPage()">
        🎀 A Surprise 🎀
    </button>


<script>
    function goToNextPage() {window.location.href = "02.html";}


function createHeart(){

    const heart=document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML="💞";

    heart.style.left=Math.random()*100+"vw";

    heart.style.fontSize=(20+Math.random()*40)+"px";

    heart.style.animationDuration=(4+Math.random()*4)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },8000);

}

setInterval(createHeart,200);

</script>
    <script>
function closeAlert() {
    document.getElementById("loveAlert").style.display = "none";
}
</script>

</body>
</html>
